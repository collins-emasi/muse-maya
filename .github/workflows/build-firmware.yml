name: Build Muse Firmware

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      
      - name: Build firmware for T-Display-S3
        run: |
          docker run --rm \
            -v ${{ github.workspace }}:/workspace \
            -w /workspace/muse-gadget-sdk/esp32 \
            espressif/idf:v6.0.1 \
            sh -c '
              rm -rf build
              mkdir build
              cp sdkconfig.defaults build/sdkconfig
              cat devices/sdkconfig.espressif-s3-devkitc-1 >> build/sdkconfig
              echo "" >> build/sdkconfig
              echo "CONFIG_GADGET_SDK_TOKEN=\"mgst_bhfCfcSEEOrt96Kou_FoHP91BtFpMOnbSb95ZAUPbe0\"" >> build/sdkconfig
              idf.py -B build build
            '
      
      - name: Upload firmware artifact
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: muse-firmware
          path: |
            muse-gadget-sdk/esp32/build/muse-gadget.bin
            muse-gadget-sdk/esp32/build/bootloader/bootloader.bin
            muse-gadget-sdk/esp32/build/partition_table/partition-table.bin
          retention-days: 30
      
      - name: Create Release
        uses: softprops/action-gh-release@v1
        if: success() && startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            muse-gadget-sdk/esp32/build/muse-gadget.bin
            muse-gadget-sdk/esp32/build/bootloader/bootloader.bin
            muse-gadget-sdk/esp32/build/partition_table/partition-table.bin
