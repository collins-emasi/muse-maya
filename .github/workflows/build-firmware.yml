name: Build Muse Firmware

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      
      - name: Build firmware for T-Display-S3
        run: |
          docker run --rm \
            -v ${{ github.workspace }}:/workspace \
            espressif/idf:v6.0.1 \
            sh -c '
              cd /workspace/muse-gadget-sdk/esp32
              mkdir -p build
              idf.py -B build \
                -DIDF_TARGET=esp32s3 \
                -DSDKCONFIG_DEFAULTS="/workspace/muse-gadget-sdk/esp32/sdkconfig.defaults;/workspace/build-config/t-display-s3/sdkconfig.lilygo-t-display-s3" \
                -DSDKCONFIG="/workspace/muse-gadget-sdk/esp32/build/sdkconfig" \
                build
            '
      
      - name: Upload firmware artifact
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: muse-firmware
          path: |
            muse-gadget-sdk/esp32/build/muse-gadget.bin
            muse-gadget-sdk/esp32/build/bootloader/bootloader.bin
            muse-gadget-sdk/esp32/build/partition_table/partition-table.bin
          retention-days: 30
      
      - name: Create Release
        uses: softprops/action-gh-release@v1
        if: success() && startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            muse-gadget-sdk/esp32/build/muse-gadget.bin
            muse-gadget-sdk/esp32/build/bootloader/bootloader.bin
            muse-gadget-sdk/esp32/build/partition_table/partition-table.bin
